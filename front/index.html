<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CredSim Alto Vale – Entrar</title>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
<nav>
  <a href="#" class="nav-logo">
    <div class="nav-logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>
      </svg>
    </div>
    CredSim Alto Vale
  </a>
</nav>

<div class="page">
  <div class="card">
    <div class="card-title">Entrar na sua conta</div>
    <div class="card-sub">Digite seu CPF e senha para acessar o simulador de crédito do Alto Vale.</div>

    <div class="erro" id="erro">CPF ou senha inválidos.</div>

    <div class="campo">
      <label class="label" for="cpf">CPF</label>
      <input class="input" type="text" id="cpf" placeholder="00000000000" maxlength="11"/>
    </div>

    <div class="campo">
      <label class="label" for="senha">Senha</label>
      <input class="input" type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()"/>
    </div>

    <button class="btn-entrar" onclick="login()">Entrar</button>

    <div class="cadastro">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
    <div class="cadastro">
      É um admin? <a href="admin.html">Faça login</a>
    </div>
  </div>
</div>

<script>
  const API = 'http://127.0.0.1:5000';

  async function login() {
    const cpf   = document.getElementById('cpf').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const erro  = document.getElementById('erro');
    erro.style.display = 'none';

    if (!cpf || !senha) {
      erro.textContent = 'Preencha todos os campos.';
      erro.style.display = 'block';
      return;
    }

    try {
      const res = await fetch(`${API}/usuarios/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cpf, senha })
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('nome', data.nome);
        window.location.href = 'dashboard.html';
      } else {
        erro.textContent = data.message || 'CPF ou senha inválidos.';
        erro.style.display = 'block';
      }
    } catch (e) {
      erro.textContent = 'Erro ao conectar com a API.';
      erro.style.display = 'block';
    }
  }
</script>
</body>
</html>
