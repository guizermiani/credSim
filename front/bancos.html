<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CredSim Alto Vale – Comparar Bancos</title>
  <link rel="stylesheet" href="css/bancos.css" />
</head>

<body>

  <nav>
    <a href="dashboard.html" class="nav-logo">
      <div class="nav-logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12" />
          <rect x="2" y="7" width="20" height="5" />
          <line x1="12" y1="22" x2="12" y2="7" />
          <path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z" />
          <path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z" />
        </svg>
      </div>
      CredSim Alto Vale
    </a>
    <div class="nav-right">
      <a href="simulacao.html" class="btn-nav btn-nav-green">Nova simulação</a>
      <button class="btn-nav" onclick="sair()">Sair</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1>Comparar bancos</h1>
      <p>Compare as taxas de juros entre as instituições e cooperativas parceiras do Alto Vale.</p>
    </div>

    <div class="tipo-tabs">
      <button class="tipo-tab active" onclick="filtrar('Pessoal', this)">Crédito Pessoal</button>
      <button class="tipo-tab" onclick="filtrar('Consignado', this)">Consignado</button>
      <button class="tipo-tab" onclick="filtrar('Imobiliário', this)">Imobiliário</button>
    </div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Banco</th>
            <th>Taxa mensal</th>
            <th>Taxa anual (aprox.)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabelaBody">
          <tr>
            <td colspan="4" class="empty">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:5000';
    let bancos = [];
    let tipoAtual = 'Pessoal';

    function checarLogin() {
      if (!localStorage.getItem('token')) window.location.href = 'index.html';
    }

    async function carregarBancos() {
      const token = localStorage.getItem('token');
      try {
        const res = await fetch(`${API}/bancos/`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        bancos = await res.json();
        renderTabela();
      } catch (e) {
        document.getElementById('tabelaBody').innerHTML = '<tr><td colspan="4" class="empty">Erro ao carregar bancos.</td></tr>';
      }
    }

    function filtrar(tipo, btn) {
      tipoAtual = tipo;
      document.querySelectorAll('.tipo-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderTabela();
    }

    function taxaPorTipo(b) {
      if (tipoAtual === 'Pessoal') return b.taxaPessoal;
      if (tipoAtual === 'Consignado') return b.taxaConsignado;
      if (tipoAtual === 'Imobiliário') return b.taxaImobiliario;
      return 0;
    }

    function renderTabela() {
      const body = document.getElementById('tabelaBody');
      if (!bancos.length) {
        body.innerHTML = '<tr><td colspan="4" class="empty">Nenhum banco cadastrado.</td></tr>';
        return;
      }

      const ordenados = [...bancos].sort((a, b) => taxaPorTipo(a) - taxaPorTipo(b));
      const melhorTaxa = taxaPorTipo(ordenados[0]);

      body.innerHTML = '';
      ordenados.forEach(b => {
        const taxa = taxaPorTipo(b);
        const taxaAnual = (Math.pow(1 + taxa / 100, 12) - 1) * 100;
        const melhor = taxa === melhorTaxa;

        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td><strong>${b.nome}</strong></td>
        <td>
          <span class="taxa-val ${melhor ? 'taxa-melhor' : ''}">${taxa}% a.m.</span>
          ${melhor ? '<span class="badge-melhor">Menor taxa</span>' : ''}
        </td>
        <td>${taxaAnual.toFixed(2)}% a.a.</td>
        <td>
          <button class="btn-simular-banco" onclick="simularComBanco(${b.idBanco})">
            Simular
          </button>
        </td>
      `;
        body.appendChild(tr);
      });
    }

    function simularComBanco(idBanco) {
      const banco = bancos.find(b => b.idBanco === idBanco);
      if (banco) {
        localStorage.setItem('bancoSelecionado', JSON.stringify(banco));
        window.location.href = 'simulacao.html';
      }
    }

    function sair() { localStorage.clear(); window.location.href = 'index.html'; }

    checarLogin();
    carregarBancos();
  </script>
</body>

</html>
