<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CredSim Alto Vale – Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-logo">
    <div class="nav-logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>
      </svg>
    </div>
    CredSim Alto Vale
  </a>
  <div class="nav-right">
    <span class="nav-nome" id="navNome"></span>
    <button class="btn-nav" onclick="sair()">Sair</button>
  </div>
</nav>

<div class="page">

  <div class="boas-vindas">
    <h1 id="titulo">Olá! 👋</h1>
    <p>Escolha um banco ou cooperativa do Alto Vale e simule seu crédito.</p>
  </div>

  <div class="section-title">Selecione um banco</div>
  <div class="bancos-grid" id="bancosGrid">
    <div style="color:#999; font-size:0.875rem;">Carregando bancos...</div>
  </div>

  <button class="btn-simular" id="btnSimular" disabled onclick="irParaSimulacao()">
    Simular com banco selecionado
  </button>

  <div class="section-title">O que você quer fazer?</div>
  <div class="acoes-grid">
    <a class="acao-card" href="historico.html">
      <div class="acao-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div class="acao-titulo">Histórico Alto Vale</div>
      <div class="acao-desc">Veja e baixe suas simulações de crédito locais</div>
    </a>
    <a class="acao-card" href="bancos.html">
      <div class="acao-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
        </svg>
      </div>
      <div class="acao-titulo">Comparar cooperativas e bancos</div>
      <div class="acao-desc">Compare taxas locais no Alto Vale</div>
    </a>
  </div>

</div>

<script>
  const API = 'http://127.0.0.1:5000';
  let bancoSelecionado = null;

  function checarLogin() {
    const token = localStorage.getItem('token');
    const nome  = localStorage.getItem('nome');
    if (!token) { window.location.href = 'index.html'; return; }
    document.getElementById('navNome').textContent = nome;
    document.getElementById('titulo').textContent  = `Olá, ${nome}! 👋`;
  }

  async function carregarBancos() {
    const token = localStorage.getItem('token');
    try {
      const res = await fetch(`${API}/bancos/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const bancos = await res.json();
      const grid = document.getElementById('bancosGrid');
      if (!bancos.length) {
        grid.innerHTML = '<div style="color:#999;font-size:0.875rem;">Nenhum banco cadastrado.</div>';
        return;
      }
      grid.innerHTML = '';
      bancos.forEach(b => {
        const card = document.createElement('div');
        card.className = 'banco-card';
        card.dataset.id = b.idBanco;
        card.innerHTML = `
          <div class="banco-nome">${b.nome}</div>
          <div class="banco-taxas">
            <div class="taxa-row"><span class="tipo">Pessoal</span><span class="val">${b.taxaPessoal}% a.m.</span></div>
            <div class="taxa-row"><span class="tipo">Consignado</span><span class="val">${b.taxaConsignado}% a.m.</span></div>
            <div class="taxa-row"><span class="tipo">Imobiliário</span><span class="val">${b.taxaImobiliario}% a.m.</span></div>
          </div>
        `;
        card.onclick = () => selecionarBanco(card, b);
        grid.appendChild(card);
      });
    } catch(e) {
      document.getElementById('bancosGrid').innerHTML = '<div style="color:#999;">Erro ao carregar bancos.</div>';
    }
  }

  function selecionarBanco(card, banco) {
    document.querySelectorAll('.banco-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    bancoSelecionado = banco;
    document.getElementById('btnSimular').disabled = false;
  }

  function irParaSimulacao() {
    if (!bancoSelecionado) return;
    localStorage.setItem('bancoSelecionado', JSON.stringify(bancoSelecionado));
    window.location.href = 'simulacao.html';
  }

  function sair() {
    localStorage.clear();
    window.location.href = 'index.html';
  }

  checarLogin();
  carregarBancos();
</script>

</body>
</html>
