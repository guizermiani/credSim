<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CredSim Alto Vale – Histórico</title>
  <link rel="stylesheet" href="css/historico.css" />
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-logo">
    <div class="nav-logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>
      </svg>
    </div>
    CredSim Alto Vale
  </a>
  <div class="nav-right">
    <a href="simulacao.html" class="btn-nav btn-nav-green">Nova simulação</a>
    <button class="btn-nav" onclick="sair()">Sair</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1>Histórico de simulações</h1>
    <p>Confira o histórico de suas simulações de crédito no Alto Vale.</p>
  </div>
  <div id="lista"></div>
</div>

<script>
  const API = 'http://127.0.0.1:5000';

  function checarLogin() {
    if (!localStorage.getItem('token')) window.location.href = 'index.html';
  }

  function fmt(n) {
    return 'R$ ' + parseFloat(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function compromClasse(pct) {
    if (pct <= 30) return 'comprom-ok';
    if (pct <= 50) return 'comprom-warn';
    return 'comprom-danger';
  }

  async function carregarHistorico() {
    const token = localStorage.getItem('token');
    const lista = document.getElementById('lista');
    try {
      const res = await fetch(`${API}/simulacoes/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const sims = await res.json();

      if (!sims.length) {
        lista.innerHTML = `
          <div class="vazio">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
            <p>Você ainda não tem simulações salvas.</p>
            <a href="simulacao.html">Fazer primeira simulação →</a>
          </div>`;
        return;
      }

      lista.innerHTML = '';
      sims.forEach(s => {
        const comprom = s.valorRenda > 0 ? (s.valorParcela / s.valorRenda) * 100 : 0;
        const cls = compromClasse(comprom);

        const card = document.createElement('div');
        card.className = 'simulacao-card';
        card.innerHTML = `
          <div>
            <div class="sim-header">
              <span class="sim-tipo">${s.tipoCredito}</span>
              <span class="sim-data">${new Date(s.dataSimulacao).toLocaleDateString('pt-BR')}</span>
              <span class="sim-banco">${s.nomeBanco || ''}</span>
              <span class="comprom-badge ${cls}">${comprom.toFixed(1)}% da renda</span>
            </div>
            <div class="sim-valores">
              <div class="sim-val-item">
                <div class="label">Parcela mensal</div>
                <div class="val green">${fmt(s.valorParcela)}</div>
              </div>
              <div class="sim-val-item">
                <div class="label">Valor solicitado</div>
                <div class="val">${fmt(s.valorCredito)}</div>
              </div>
              <div class="sim-val-item">
                <div class="label">Prazo</div>
                <div class="val">${s.prazoMeses}x</div>
              </div>
              <div class="sim-val-item">
                <div class="label">Taxa</div>
                <div class="val">${s.taxaJuros}% a.m.</div>
              </div>
            </div>
          </div>
          <div class="sim-acoes">
            <button class="btn-pdf" onclick="gerarExcel(${s.idSimulacao})">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/>
  </svg>
  Baixar Planilha
</button>
            <button class="btn-del" onclick="deletar(${s.idSimulacao}, this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
              Excluir
            </button>
          </div>
        `;
        lista.appendChild(card);
      });
    } catch(e) {
      lista.innerHTML = '<div style="color:#999;padding:2rem;">Erro ao carregar histórico.</div>';
    }
  }

  function gerarExcel(idSimulacao) {
  const token = localStorage.getItem('token');
  window.open(`${API}/simulacoes/excel/${idSimulacao}?token=${token}`, '_blank');
  }

  async function deletar(id, btn) {
    if (!confirm('Excluir esta simulação?')) return;
    const token = localStorage.getItem('token');
    try {
      const res = await fetch(`${API}/simulacoes/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        btn.closest('.simulacao-card').remove();
      }
    } catch(e) {
      alert('Erro ao excluir simulação.');
    }
  }

  function sair() { localStorage.clear(); window.location.href = 'index.html'; }

  checarLogin();
  carregarHistorico();
</script>
</body>
</html>
