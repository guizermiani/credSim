<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CredSim Alto Vale – Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>
      </svg>
    </div>
    CredSim Alto Vale
  </a>
</nav>
<div class="page">
  <div class="card">
    <div class="card-title">Criar conta</div>
    <div class="card-sub">Preencha os dados para simular taxas de cooperativas e bancos do Alto Vale.</div>
    <div class="erro" id="erro"></div>
    <div class="sucesso" id="sucesso">Conta criada! Redirecionando...</div>
    <div class="campo"><label class="label">CPF</label><input class="input" type="text" id="cpf" placeholder="00000000000" maxlength="11"/></div>
    <div class="campo"><label class="label">Nome completo</label><input class="input" type="text" id="nome" placeholder="Seu nome"/></div>
    <div class="campo"><label class="label">E-mail</label><input class="input" type="email" id="email" placeholder="seu@email.com"/></div>
    <div class="campo"><label class="label">Senha</label><input class="input" type="password" id="senha" placeholder="••••••••"/></div>
    <button class="btn" onclick="cadastrar()">Criar conta</button>
    <div class="login-link">Já tem conta? <a href="index.html">Entrar</a></div>
  </div>
</div>
<script>
  const API = 'http://127.0.0.1:5000';
  async function cadastrar() {
    const cpf   = document.getElementById('cpf').value.trim();
    const nome  = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const erro  = document.getElementById('erro');
    const suc   = document.getElementById('sucesso');
    erro.style.display = 'none';
    if (!cpf || !nome || !email || !senha) {
      erro.textContent = 'Preencha todos os campos.';
      erro.style.display = 'block'; return;
    }
    try {
      const res = await fetch(`${API}/usuarios/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cpf, nome, email, senha })
      });
      const data = await res.json();
      if (res.ok) {
        suc.style.display = 'block';
        setTimeout(() => window.location.href = 'index.html', 1500);
      } else {
        erro.textContent = data.message || 'Erro ao cadastrar.';
        erro.style.display = 'block';
      }
    } catch(e) {
      erro.textContent = 'Erro ao conectar com a API.';
      erro.style.display = 'block';
    }
  }
</script>
</body>
</html>
